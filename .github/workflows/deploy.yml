name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Check if directory exists, if not, clone it
            if [ ! -d "/home/${{ secrets.VPS_USERNAME }}/daffodilai" ]; then
              echo "Directory does not exist. Cloning repository..."
              cd /home/${{ secrets.VPS_USERNAME }} || exit 1
              git clone https://github.com/mdrafiqulalamrubel/daffodilai.git || exit 1
            fi

            # Navigate to the deployment directory
            cd /home/${{ secrets.VPS_USERNAME }}/daffodilai || exit 1

            # Directory may exist without being a git repo (e.g. first manual copy). Repair in place
            # without touching untracked data (./data, .env) rather than pulling into a non-repo.
            if [ ! -d ".git" ]; then
              echo "Directory exists but is not a git repository. Initializing in place..."
              git init
              git remote add origin https://github.com/mdrafiqulalamrubel/daffodilai.git
            fi

            # Fetch and hard-reset to origin/main (avoids merge conflicts on a deploy-only checkout;
            # untracked files like ./data and .env are left alone).
            git fetch origin main || exit 1
            git reset --hard origin/main || exit 1
            
            # Check Docker and install if missing
            echo "Checking Docker installation..."
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              curl -fsSL https://get.docker.com -o get-docker.sh
              sudo sh get-docker.sh
              sudo usermod -aG docker ${{ secrets.VPS_USERNAME }}
            fi
            
            # Build and restart the Docker container with verbose output
            echo "Building and starting Docker containers..."
            sudo docker compose up -d --build || sudo docker-compose up -d --build || exit 1
            
            echo "Deployment completed successfully"
