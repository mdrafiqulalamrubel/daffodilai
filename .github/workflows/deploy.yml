name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Check if directory exists, if not, clone it
            if [ ! -d "/home/${{ secrets.VPS_USERNAME }}/daffodilai" ]; then
              echo "Directory does not exist. Cloning repository..."
              cd /home/${{ secrets.VPS_USERNAME }} || exit 1
              git clone https://github.com/mdrafiqulalamrubel/daffodilai.git || exit 1
            fi
            
            # Navigate to the deployment directory
            cd /home/${{ secrets.VPS_USERNAME }}/daffodilai || exit 1
            
            # Pull the latest changes from GitHub
            git pull origin main || exit 1
            
            # Check Docker and Docker Compose
            echo "Checking Docker installation..."
            docker --version || exit 1
            docker compose version || exit 1
            
            # Build and restart the Docker container with verbose output
            echo "Building and starting Docker containers..."
            docker compose up -d --build || exit 1
            
            echo "Deployment completed successfully"
